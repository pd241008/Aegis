# Aegis: distributed telemetry engine — local dev stack.
#
# Brings up the full pipeline in one command:
#   docker compose -f deployments/docker-compose.yml up --build
#
# Services:
#   brain      - Scala/Akka correlation cluster (gRPC :9090, HTTP API :9091)
#   sentinel-N - Go edge agents streaming host telemetry into the brain
#
# Optional env overrides (see compose.env.example):
#   AEGIS_CORR_MIN_AGENTS - agents required to form an incident (default 2)

name: aegis

services:
  brain:
    build:
      context: ..
      dockerfile: Dockerfile.cluster
    container_name: aegis-brain
    restart: unless-stopped
    environment:
      AEGIS_BRAIN_PORT: "9090"
      AEGIS_HTTP_PORT: "9091"
      AEGIS_BUFFER_DIR: /data/buffers
      AEGIS_BRIEFING_DIR: /data/briefings
      AEGIS_INCIDENT_DIR: /data/incidents
      AEGIS_CORR_MIN_AGENTS: "${AEGIS_CORR_MIN_AGENTS:-2}"
      AEGIS_CORR_WINDOW_MS: "10000"
      # API-backed briefings (ADR-011); blank/unset => rule-based fallback (ADR-008)
      AEGIS_LLM_PROVIDER: "${AEGIS_LLM_PROVIDER:-}"
      AEGIS_LLM_API_KEY: "${AEGIS_LLM_API_KEY:-}"
      AEGIS_LLM_MODEL: "${AEGIS_LLM_MODEL:-gpt-4o-mini}"
      AEGIS_LLM_BASE_URL: "${AEGIS_LLM_BASE_URL:-}"
      AEGIS_LLM_TIMEOUT_MS: "${AEGIS_LLM_TIMEOUT_MS:-30000}"
      # API-backed embeddings for retrieval (ADR-012); blank/unset => hash embeddings
      AEGIS_EMBED_PROVIDER: "${AEGIS_EMBED_PROVIDER:-}"
      AEGIS_EMBED_API_KEY: "${AEGIS_EMBED_API_KEY:-}"
      AEGIS_EMBED_MODEL: "${AEGIS_EMBED_MODEL:-text-embedding-3-small}"
      AEGIS_EMBED_BASE_URL: "${AEGIS_EMBED_BASE_URL:-}"
      AEGIS_EMBED_TIMEOUT_MS: "${AEGIS_EMBED_TIMEOUT_MS:-30000}"
      AEGIS_EMBED_DIMS: "${AEGIS_EMBED_DIMS:-}"
    ports:
      - "9090:9090"
      - "9091:9091"
    volumes:
      - aegis-brain-data:/data
    healthcheck:
      # dash (the CMD-SHELL shell on jammy) has no /dev/tcp, so run the probe
      # under bash explicitly.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9091'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  sentinel-1:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    container_name: aegis-sentinel-1
    restart: unless-stopped
    environment:
      AEGIS_BRAIN_ADDR: brain:9090
      AEGIS_AGENT_ID: sentinel-001
      AEGIS_PERSIST_DIR: /data/persist
      # Anomaly detection: defaults are production-grade (95/90, streak of 3).
      # CI/smoke overrides make a flush deterministically fire so the
      # e2e check can exercise retrieval, briefings and incidents.
      AEGIS_CPU_ANOMALY_THRESHOLD: "${AEGIS_SMOKE_CPU_THRESHOLD:-95}"
      AEGIS_MEM_ANOMALY_THRESHOLD: "${AEGIS_SMOKE_MEM_THRESHOLD:-90}"
      AEGIS_ANOMALY_MIN_CONSECUTIVE: "${AEGIS_SMOKE_MIN_CONSECUTIVE:-3}"
    volumes:
      - aegis-sentinel-1-persist:/data/persist
      - /proc:/proc:ro
    depends_on:
      brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f aegis-agent"]
      interval: 5s
      timeout: 3s
      retries: 12

  sentinel-2:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    container_name: aegis-sentinel-2
    restart: unless-stopped
    environment:
      AEGIS_BRAIN_ADDR: brain:9090
      AEGIS_AGENT_ID: sentinel-002
      AEGIS_PERSIST_DIR: /data/persist
      AEGIS_CPU_ANOMALY_THRESHOLD: "${AEGIS_SMOKE_CPU_THRESHOLD:-95}"
      AEGIS_MEM_ANOMALY_THRESHOLD: "${AEGIS_SMOKE_MEM_THRESHOLD:-90}"
      AEGIS_ANOMALY_MIN_CONSECUTIVE: "${AEGIS_SMOKE_MIN_CONSECUTIVE:-3}"
    volumes:
      - aegis-sentinel-2-persist:/data/persist
      - /proc:/proc:ro
    depends_on:
      brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f aegis-agent"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  aegis-brain-data:
  aegis-sentinel-1-persist:
  aegis-sentinel-2-persist:
