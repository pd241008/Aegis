name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  agent:
    name: Go agent (test + vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: agent/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  brain:
    name: Scala cluster (sbt test + assembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: sbt-${{ hashFiles('cluster/build.sbt', 'cluster/project/*.sbt') }}
      - name: Compile, test, and assemble
        run: sbt -batch test assembly
        working-directory: cluster

  smoke:
    name: Docker Compose E2E smoke check
    runs-on: ubuntu-latest
    needs: [agent, brain]
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-check the stack
        run: scripts/e2e.sh
        env:
          MAX_WAIT: "300"
          # Make agent-side anomalies fire deterministically so the retrieval
          # check sees indexed telemetry within the CI time budget.
          AEGIS_SMOKE_CPU_THRESHOLD: "50"
          AEGIS_SMOKE_MEM_THRESHOLD: "50"
          AEGIS_SMOKE_MIN_CONSECUTIVE: "1"